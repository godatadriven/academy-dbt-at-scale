version: 2

seeds:
  # Raw source seeds simulate the upstream data pipelines.
  # They land in the same schemas the source definitions point at,
  # so the project works without an external ingestion layer.
  #
  # BigQuery note: `database:` is intentionally omitted. On BigQuery
  # `database` maps to the GCP project ID, and "mediapulse_raw" is not a
  # valid project ID (underscores are not allowed). With no `database`,
  # the seeds land in the target project and in datasets named by
  # `schema` below - which is exactly where the source() definitions
  # look once their `database:` lines are removed too. Column types use
  # `string`/`timestamp` (BigQuery has no `varchar`).
  - name: raw_news__authors
    config:
      schema: news
      alias: authors
      column_types:
        joined_at: string

  - name: raw_news__articles
    config:
      schema: news
      alias: articles
      column_types:
        published_at: string
        updated_at: string

  - name: raw_news__articles_updated
    config:
      schema: news
      alias: articles_updated
      column_types:
        published_at: string
        updated_at: string

  - name: raw_news__page_views
    config:
      schema: news
      alias: views
      column_types:
        viewed_at: string

  - name: raw_podcasts__shows
    config:
      schema: podcasts
      alias: shows
      column_types:
        launched_at: string

  - name: raw_podcasts__episodes
    config:
      schema: podcasts
      alias: episodes
      column_types:
        published_at: string

  - name: raw_podcasts__episodes_updated
    config:
      schema: podcasts
      alias: episodes_updated
      column_types:
        published_at: string

  - name: raw_podcasts__listens
    config:
      schema: podcasts
      alias: listens
      column_types:
        listened_at: string

  - name: raw_streaming__content_catalog
    config:
      schema: streaming
      alias: content_ctlg
      column_types:
        release_date: string

  - name: raw_streaming__subscriptions
    config:
      schema: streaming
      alias: subscriptions_lifecycle_rec
      column_types:
        start_date: string
        start_time: string
        end_date: string
        end_time: string

  - name: raw_streaming__watch_events
    config:
      schema: streaming
      alias: usr_watch_events_log
      column_types:
        watched_at: string
        batched_at: timestamp

  - name: raw_ads__campaigns
    config:
      schema: ads
      alias: campaigns
      column_types:
        start_date: string
        end_date: string

  - name: raw_ads__impressions
    config:
      schema: ads
      alias: impressions
      column_types:
        impression_date: string

  - name: raw_ads__spend
    config:
      schema: ads
      alias: spend
      column_types:
        spend_date: string

## Legacy data

  - name: raw_legacy_streaming__content_catalog
    config:
      schema: streamview_legacy
      alias: media_catalog_archive
      column_types:
        release_dt: string

  - name: raw_legacy_streaming__subscriptions
    config:
      schema: streamview_legacy
      alias: acct_subs_archive
      column_types:
        start_dt: string
        start_tm: string
        end_dt: string
        end_tm: string

  - name: raw_legacy_streaming__watch_pings
    config:
      schema: streamview_legacy
      alias: playback_heartbeats
      column_types:
        ping_date: string
        ping_time: string

  - name: raw_crm__sales_reps
    config:
      schema: crm
      alias: sales_reps
      column_types:
        hire_date: string

  - name: raw_crm__advertiser_accounts
    config:
      schema: crm
      alias: advertiser_accounts
      column_types:
        signed_at: string

  - name: raw_crm__contracts
    config:
      schema: crm
      alias: contracts
      column_types:
        start_date: string
        end_date: string

  - name: raw_crm__touchpoints
    config:
      schema: crm
      alias: touchpoints
      column_types:
        occurred_at: string
