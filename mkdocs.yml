site_name: "dbt@scale Workshop"
site_description: "2-day dbt workshop for MediaPulse - powered by Xebia & dbt Labs"
docs_dir: docs
site_dir: site

theme:
  name: material
  logo: images/mediapulse_logo_small.svg
  favicon: images/mediapulse_logo_small.svg
  palette:
    - scheme: default
      primary: deep-orange
      accent: orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: deep-orange
      accent: orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.code.annotate
    - toc.follow
    - search.highlight
    - search.suggest

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tasklist:
      clickable_checkbox: true
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true

plugins:
  - search
  - encryptcontent:
      # Change this password before sharing with participants
      # global_password: "dbtscale2026"
      title_prefix: ""
      summary: "This content is password-protected."
      placeholder: "Enter workshop password"
      decryption_failure_message: "Incorrect password - check with your Xebia facilitator."
      encryption_info_message: "Contact your facilitator for the workshop password."
      remember_keys: true
      session_storage: false

nav:
  - Home: index.md
  - Agenda: agenda.md
  - MediaPulse Project:
      - Overview: mediapulse/overview.md
      - Data ERD: mediapulse/data-erd.md
  - "Group 1 - Intermediate":
      - Overview: group1/overview.md
      - Part 1:
        - 1. dbt Catalog: group1/1.1-dbt-catalog.md
        - 2. Modeling refresh: group1/1.2-modeling-refresh.md
        - 3. Testing: group1/1.3-testing.md
        - 4. Jinja & Macros: group1/1.4-jinja-and-macros.md
        - 5. dbt Wizard: group1/1.5-dbt-wizard.md
      - Part 2:
        - 1. Advanced testing: group1/2.1-advanced-testing.md
        - 2. Snapshots: group1/2.2-snapshots.md
        - 3. Model governance: group1/2.3-model-governance.md
        - 4. Incremental modeling: group1/2.4-incremental-modeling.md
  - "Group 2 - Advanced I":
      - Overview: group2/overview.md
      - Part 1:
        - 1. dbt Catalog & review: group2/1.1-dbt-catalog-and-review.md
        - 2. Advanced testing: group2/1.2-advanced-testing.md
        - 3. Jinja/Macros & Custom schema logic: group2/1.3-jinja-macros-and-custom-schema-logic.md
        - 4. dbt Mesh: group2/1.4-dbt-mesh.md
      - Part 2:
        - 1. Project evaluation & further tests: group2/2.1-project-evaluation-and-further-tests.md
        - 2. dbt Mesh: group2/2.2-dbt-mesh.md
        - 3. Dynamic data masking: group2/2.3-dynamic-data-masking.md
        - 4. Deployment & CI/CD: group2/2.4-deployment-and-cicd.md
  - "Group 3 - Advanced II":
      - Overview: group3/overview.md
      - Part 1:
        - 1. dbt Catalog & review: group3/1.1-dbt-catalog-and-review.md
        - 2. Testing coverage: group3/1.2-testing-coverage.md
        - 3. Deployment & CI/CD: group3/1.3-deployment-and-cicd.md
        - 4. dbt Mesh: group3/1.4-dbt-mesh.md
      - Part 2:
        - 1. dbt Mesh review: group3/2.1-dbt-mesh-review.md
        - 2. Advanced Testing: group3/2.2-advanced-testing.md
        - 3. Dynamic data masking: group3/2.3-dynamic-data-masking.md
        - 4. Unit testing: group3/2.4-unit-testing.md
  - "Group 4 - Power Users":
      - Overview: group4/overview.md
      - Checklists:
        - Group 4 - Level 1: group4/level1/checklist.md
        - Group 4 - Level 2: group4/level2/checklist.md
        - Group 4 - Level 3 - Bonus: group4/level3/checklist.md

extra_javascript:
  - javascripts/checklist.js

extra:
  generator: false
