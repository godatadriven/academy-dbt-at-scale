version: 2

models:
  - name: dim_authors
    description: >
      One row per NewsNow author, enriched with article output stats. Authors
      with no articles still appear, with total_articles at zero.
    columns:
      - name: author_id
        description: Primary key.
        data_tests:
          - not_null
          - unique
      - name: author_name
        description: Author's full name.
        data_tests:
          - not_null
      - name: email
        data_tests:
          - not_null
      - name: joined_at
        data_tests:
          - not_null
      - name: total_articles
        description: Count of articles attributed to this author. Zero if none.
        data_tests:
          - not_null
      - name: first_published_at
      - name: most_recent_published_at

  - name: fct_news_page_views
    description: >
      One row per article page view event, enriched with the article's category
      and author. Article attributes are taken from the article's most recently
      updated version.
    columns:
      - name: view_id
        description: Primary key.
        data_tests:
          - not_null
          - unique
      - name: article_id
        description: Foreign key to dim_authors via author_id, and to the article catalogue.
        data_tests:
          - not_null
      - name: category
      - name: author_id
        description: Foreign key to dim_authors.
        data_tests:
          - not_null
      - name: user_id
      - name: viewed_at
        description: Timestamp of the page view event.
        data_tests:
          - not_null
      - name: referrer_source
        data_tests:
          - accepted_values:
              arguments:
                values: ["search", "social", "direct", "email"]

  - name: fct_article_scores
    description: >
      Fact table containing one row per news article, with author and
      category attributes plus aggregated reader-response scores
      (weighted totals and averages).
    columns:
      - name: article_id
        description: Primary key. Unique identifier for the article.
        data_tests:
          - unique
          - not_null

      - name: title
        description: Headline/title of the article.

      - name: author_id
        description: Foreign key to the author who wrote the article.

      - name: category
        description: Editorial category the article was published under.

      - name: status
        description: Current publication status of the article.

      - name: published_at
        description: Timestamp when the article was (or would be) published.

      - name: total_weighted_score
        description: Sum of all reader response scores, weighted, for the article.

      - name: total_responses
        description: Count of reader responses used to compute the scores.

      - name: weighted_avg_score
        description: Weighted average reader response score for the article (total_weighted_score / total_responses).