version: 2

models:
  - name: dim_shows
    description: >
      One row per PodcastHub show, enriched with episode output stats. Shows
      with no episodes still appear, with total_episodes at zero.
    columns:
      - name: show_id
        description: Primary key.
        data_tests:
          - not_null
          - unique
      - name: show_name
        description: Display name of the show.
        data_tests:
          - not_null
      - name: host_name
        description: 
        data_tests:
          - not_null
      - name: category
        description: Show's category
        data_tests:
          - not_null
      - name: launched_at
        description: launch date of the show
        data_tests:
          - not_null
      - name: total_episodes
        description: Count of episodes published under this show. Zero if none.
        data_tests:
          - not_null
      - name: first_episode_at
        description: date first episode published
      - name: most_recent_episode_at
        description: date of most recent episode

  - name: fct_podcast_listens
    description: >
      One row per episode/show/platform combination, aggregating listen
      sessions from PodcastHub.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - episode_id
              - show_id
              - platform
    columns:
      - name: episode_id
        description: Foreign key to the episode.
        data_tests:
          - not_null
      - name: show_id
        description: Foreign key to the show.
        data_tests:
          - not_null
      - name: platform
        description: Platform the listens occurred on.
        data_tests:
          - not_null:
              config:
                where: "number_of_listens > 0"
      - name: number_of_listens
        description: Count of listen sessions for this episode/show/platform.
      - name: average_listen_seconds
        description: Average listen duration, in seconds.
      - name: average_completion_rate
        description: Average completion rate across listens.
      - name: completion_bucket
        description: >
          Bucketed completion status based on average_completion_rate:
          completed (>90%), dropped_before_content (<10%), partial
          (otherwise), or no_listens when there are no listens.
        data_tests:
          - accepted_values:
              config:
                where: "number_of_listens > 0"
              arguments: 
                values: ['completed', 'dropped_before_content', 'partial', 'no_listens']
