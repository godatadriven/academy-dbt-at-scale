version: 2

models:
  - name: dim_shows
    description: >
      One row per PodcastHub show, enriched with episode output stats. Shows
      with no episodes still appear, with total_episodes at zero.
    columns:
      - name: show_id
        description: Primary key.
        data_tests:
          - not_null
          - unique
      - name: show_name
        description: Display name of the show.
        data_tests:
          - not_null
      - name: host_name
        data_tests:
          - not_null
      - name: category
        data_tests:
          - not_null
      - name: launched_at
        data_tests:
          - not_null
      - name: total_episodes
        description: Count of episodes published under this show. Zero if none.
        data_tests:
          - not_null
      - name: first_episode_at
      - name: most_recent_episode_at

  - name: fct_podcast_listens
    description: >
      One row per podcast listen session, enriched with the episode's show and
      a per-session completion rate.
    columns:
      - name: listen_id
        description: Primary key.
        data_tests:
          - not_null
          - unique
      - name: episode_id
        description: Foreign key to the episode catalogue.
        data_tests:
          - not_null
      - name: show_id
        description: Foreign key to dim_shows.
        data_tests:
          - not_null
      - name: user_id
      - name: listened_at
        description: Timestamp when the listen session started.
        data_tests:
          - not_null
      - name: listen_duration_seconds
        data_tests:
          - not_null
      - name: completion_rate
        description: >
          Fraction of the episode listened to in this session, capped at 1.0 so a
          listen longer than the episode duration counts as fully completed.
        data_tests:
          - dbt_utils.accepted_range:
              arguments: 
                - min_value: 0
                - max_value: 1
      - name: platform
        data_tests:
          - accepted_values:
              arguments:
                values: ["ios", "android", "web", "alexa", "other"]
