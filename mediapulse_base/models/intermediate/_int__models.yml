version: 2

models:
  - name: int_campaign_content_spend_allocation
    description: >
      Allocates actual campaign spend (from the spend table) down to individual content
      items, proportional to each item's share of impressions within the campaign.

      The allocation rule differs by campaign type. Brand/awareness campaigns (display,
      video, newsletter) distribute spend across all content regardless of engagement.
      Performance campaigns (sponsored_content, podcast_ad) only attribute spend to
      content that drove at least one click - and crucially, zero-click content is
      removed from the denominator too, so the remaining items still sum to 100% of spend.
      This means the same impressions data produces completely different allocations
      depending on campaign_type.
    config:
      materialized: view
    columns:
      - name: campaign_id
        description: Foreign key to stg_ads__campaigns.
        data_tests:
          - not_null
      - name: campaign_type
        description: Campaign type inherited from campaigns. Drives the allocation rule.
      - name: content_id
        description: >
          The content item receiving the allocated spend. For performance campaigns,
          only content items with clicks > 0 appear.
        data_tests:
          - not_null
      - name: total_spend_cents
        description: Total actual spend for the campaign across all spend records.
      - name: impressions_count
        description: Impression count for this content item within the campaign.
      - name: total_eligible_impressions
        description: >
          Sum of impressions across all eligible content items in the campaign.
          For performance campaigns this excludes zero-click content, which changes
          the denominator used in the allocation.
      - name: allocated_spend_cents
        description: >
          Spend attributed to this content item, rounded to the nearest cent.
          Equals total_spend_cents * (impressions_count / total_eligible_impressions).
  - name: int_dedupe_subscribers
    description: >
      The most recent subscription event for each user. Events are ordered by updated_at,
      with the subscription start timestamp and subscription_id used as deterministic
      fallbacks when updated_at is null or tied.
    config:
      materialized: view
    columns:
      - name: subscription_id
        description: Identifier for the user's most recent subscription event.
        data_tests:
          - not_null
      - name: user_id
        description: Primary key - one row per subscriber.
        data_tests:
          - not_null
          - unique
      - name: plan_type
        description: Plan associated with the most recent subscription event.
      - name: status
        description: Status from the most recent subscription event.
      - name: start_date
        description: Raw start date for the subscription.
      - name: start_time
        description: Raw start time for the subscription.
      - name: end_date
        description: Raw end date for the subscription, when present.
      - name: end_time
        description: Raw end time for the subscription, when present.
      - name: monthly_fee_cents
        description: Monthly subscription fee in cents.
      - name: updated_at
        description: Timestamp used to identify the latest subscription event.
  - name: int_shows_clean_string_columns
    description: >
      One row per podcast show with show and host names standardized for downstream use.
      Show names have HTML entities, whitespace, decorative or marketing text, and casing
      normalized. Host names have whitespace, credential or role suffixes, and casing
      normalized. Show identifiers, categories, and launch timestamps pass through unchanged.
    config:
      materialized: view
    columns:
      - name: show_id
        description: Primary key, passed through unchanged from stg_podcasts__shows.
        data_tests:
          - not_null
          - unique
      - name: show_name
        description: >
          Cleaned display name of the show. HTML ampersand entities are decoded, whitespace
          is collapsed and trimmed, decorative or marketing text is removed, and title case
          is applied.
      - name: host_name
        description: >
          Cleaned name of the primary host. Whitespace is collapsed and trimmed, trailing
          credential or role suffixes are removed, and title case is applied.
      - name: category
        description: Show genre/category, passed through unchanged from stg_podcasts__shows.
      - name: launched_at
        description: Show launch timestamp, passed through unchanged from stg_podcasts__shows.
  - name: int_podcasts_listens_completion_rates
    description: >
      One row per podcast listen session, enriched with the episode's show and
      a per-session completion rate.
    columns:
      - name: listen_id
        description: Primary key.
        data_tests:
          - not_null
          - unique
      - name: episode_id
        description: Foreign key to the episode catalogue.
        data_tests:
          - not_null
      - name: show_id
        description: Foreign key to dim_shows.
        data_tests:
          - not_null
      - name: user_id
      - name: listened_at
        description: Timestamp when the listen session started.
        data_tests:
          - not_null
      - name: listen_duration_seconds
        data_tests:
          - not_null
      - name: completion_rate
        description: >
          Fraction of the episode listened to in this session, capped at 1.0 so a
          listen longer than the episode duration counts as fully completed.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
      - name: platform
        data_tests:
          - accepted_values:
              arguments:
                values: ["ios", "android", "web", "alexa", "other"]
              config:
                severity: warn
  - name: int_news__articles_deduped
    description: >
      All news articles, keep only the most recent update and status of the article. One row per article.
    columns:
      - name: article_id
        description: Primary key.
        data_tests:
          - not_null
          - unique
      - name: title
        description: Article headline.
      - name: author_id
        description: Foreign key to authors.
      - name: category
        description: Editorial category of the artcile
      - name: status
        description: Current article lifecycle status.
      - name: published_at
        description: Timestamp when the article first went live. There are no unpublished articles.
      - name: updated_at
        description: Timestamp of the most recent edit or republication.
      - name: word_count
        description: Number of words in the article body.
      - name: score_relevance
        description: Relevance score of the article
      - name: score_clarity
        description: Clarity score of the article
      - name: score_bias
        description: Bias score of the article
      - name: score_trust
        description: Trust score of the article
      - name: score_engagement
        description: Engagement score of the article
      - name: num_responses_relevance
        description: number of responseses for the relevance score
      - name: num_responses_clarity
        description: number of responseses for the clarity score
      - name: num_responses_bias
        description: number of responseses for the bias score
      - name: num_responses_trust
        description: number of responseses for the trust score
      - name: num_responses_engagement
        description: number of responseses for the engagement score
