version: 2

models:
  - name: int_campaign_content_spend_allocation
    description: >
      Allocates actual campaign spend (from the spend table) down to individual content
      items, proportional to each item's share of impressions within the campaign.

      The allocation rule differs by campaign type. Brand/awareness campaigns (display,
      video, newsletter) distribute spend across all content regardless of engagement.
      Performance campaigns (sponsored_content, podcast_ad) only attribute spend to
      content that drove at least one click - and crucially, zero-click content is
      removed from the denominator too, so the remaining items still sum to 100% of spend.
      This means the same impressions data produces completely different allocations
      depending on campaign_type.
    config:
      materialized: view
    columns:
      - name: campaign_id
        description: Foreign key to stg_ads__campaigns.
        data_tests:
          - not_null
      - name: campaign_type
        description: Campaign type inherited from campaigns. Drives the allocation rule.
      - name: content_id
        description: >
          The content item receiving the allocated spend. For performance campaigns,
          only content items with clicks > 0 appear.
        data_tests:
          - not_null
      - name: total_spend_cents
        description: Total actual spend for the campaign across all spend records.
      - name: impressions_count
        description: Impression count for this content item within the campaign.
      - name: total_eligible_impressions
        description: >
          Sum of impressions across all eligible content items in the campaign.
          For performance campaigns this excludes zero-click content, which changes
          the denominator used in the allocation.
      - name: allocated_spend_cents
        description: >
          Spend attributed to this content item, rounded to the nearest cent.
          Equals total_spend_cents * (impressions_count / total_eligible_impressions).
  - name: int_dedupe_subscribers
    description: >
      The most recent subscription event for each user. Events are ordered by updated_at,
      with the subscription start timestamp and subscription_id used as deterministic
      fallbacks when updated_at is null or tied.
    config:
      materialized: view
    columns:
      - name: subscription_id
        description: Identifier for the user's most recent subscription event.
        data_tests:
          - not_null
      - name: user_id
        description: Primary key - one row per subscriber.
        data_tests:
          - not_null
          - unique
      - name: plan_type
        description: Plan associated with the most recent subscription event.
      - name: status
        description: Status from the most recent subscription event.
      - name: start_date
        description: Raw start date for the subscription.
      - name: start_time
        description: Raw start time for the subscription.
      - name: end_date
        description: Raw end date for the subscription, when present.
      - name: end_time
        description: Raw end time for the subscription, when present.
      - name: monthly_fee_cents
        description: Monthly subscription fee in cents.
      - name: updated_at
        description: Timestamp used to identify the latest subscription event.

  - name: int_shows_clean_string_columns
    description: >
      One row per PodcastHub show with display strings standardized for downstream use.
      Decodes ampersand HTML entities, normalizes whitespace, removes decorative and
      marketing text from show names, strips credential and role suffixes from host names,
      and converts both names to title case. Category and launch timestamp are passed
      through unchanged.
    config:
      materialized: view
    columns:
      - name: show_id
        description: Primary key passed through unchanged from stg_podcasts__shows.
        data_tests:
          - not_null
          - unique
      - name: show_name
        description: >
          Cleaned display name with ampersand HTML entities decoded, whitespace normalized,
          decorative and marketing text removed, and casing standardized to title case.
      - name: host_name
        description: >
          Cleaned primary host name with whitespace normalized, trailing credentials and
          role labels removed, and casing standardized to title case.
      - name: category
        description: Show genre/category passed through unchanged from stg_podcasts__shows.
      - name: launched_at
        description: Show launch timestamp passed through unchanged from stg_podcasts__shows.
