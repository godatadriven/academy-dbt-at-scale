version: 2

models:
  - name: stg_ads__campaigns
    description: >
      Staged campaign records from AdConnect. One row per campaign. Reads
      directly from the ads.campaigns table rather than through a source()
      definition.
    columns:
      - name: campaign_id
        description: Primary key.
        data_tests:
          - not_null
          - unique
      - name: advertiser_id
        description: The advertiser who owns this campaign.
        data_tests:
          - not_null
      - name: campaign_name
      - name: campaign_type
        description: "Campaign type. Expected values: display, video, sponsored_content, podcast_ad, newsletter."
        data_tests:
          - accepted_values:
              arguments:
                values: ["display", "video", "sponsored_content", "podcast_ad", "newsletter"]
      - name: start_date
        data_tests:
          - not_null
      - name: end_date
        data_tests:
          - not_null
      - name: budget_cents

  - name: stg_ads__impressions
    description: >
      Staged impression records from AdConnect. One row per campaign/content
      impression record. Reads directly from the ads.impressions table rather
      than through a source() definition.
    columns:
      - name: impression_id
        description: Primary key.
        data_tests:
          - not_null
          - unique
      - name: campaign_id
        description: Foreign key to stg_ads__campaigns.
        data_tests:
          - not_null
      - name: content_id
        data_tests:
          - not_null
      - name: impression_date
        data_tests:
          - not_null
      - name: impressions_count
        data_tests:
          - not_null
      - name: clicks

  - name: stg_ads__spend
    description: >
      Staged spend records from AdConnect. One row per campaign/day spend
      record. Reads directly from the ads.spend table rather than through a
      source() definition.
    columns:
      - name: spend_id
        description: Primary key.
        data_tests:
          - not_null
          - unique
      - name: campaign_id
        description: Foreign key to stg_ads__campaigns.
        data_tests:
          - not_null
      - name: spend_date
        data_tests:
          - not_null
      - name: spend_cents
        data_tests:
          - not_null
      - name: platform_fee_cents
