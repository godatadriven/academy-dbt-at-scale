# models/staging/_news__sources.yml

version: 2

sources:
  - name: news
    description: >
      Raw news platform data, loaded from the source system with no
      transformation applied. Includes articles, authors, and page view
      events. Known data quality issues in this layer: inconsistent
      casing/synonyms in `category`, `status`, and `referrer_source`;
      duplicate rows per natural key representing edits over time
      (articles, authors); missing/sentinel values in survey score
      columns (blank strings, `-1`, `"N/A"`).
    # database: omitted for BigQuery - `database` maps to the GCP project ID
    # and "mediapulse_raw" is not a valid project ID. Resolves to the target
    # project + the `news` dataset, where set_up_project's seeds land.
    schema: news

    tables:
      - name: articles
        description: >
          One row per article version. An article may appear more than
          once if it was edited after publishing (see `updated_at`) -
          downstream models must deduplicate to the latest version per
          `article_id`.
        columns:
          - name: article_id
            description: >
              Natural key for an article. Not unique in this raw table -
              an article can have multiple rows representing edits over
              time. Uniqueness only holds after deduplication downstream.
          - name: title
            description: Headline of the article at the time of this row's version.
          - name: author_id
            description: Foreign key to `raw_news__authors.author_id`.
          - name: category
            description: >
              Raw category label. Contains casing inconsistencies and
              synonyms (e.g. "tech", "Tech", "technology" all represent
              the same category) - not yet normalized.
          - name: published_at
            description: Timestamp the article was originally published.
          - name: updated_at
            description: >
              Timestamp this specific row/version was last modified. Used
              to determine the most recent version of an article when
              deduplicating.
          - name: status
            description: >
              Raw publication status. Contains synonyms (e.g. "live" and
              "published" mean the same thing) - not yet normalized.
          - name: word_count
            description: Word count of the article at the time of this row's version.
          - name: score_relevance
            description: >
              Average reader-survey relevance score, 0-10 scale. May be
              blank or `-1` (sentinel for "not enough responses").
          - name: score_clarity
            description: >
              Average reader-survey clarity score, 0-10 scale. May be
              blank.
          - name: score_bias
            description: >
              Average reader-survey perceived-bias score, on a 1-5 scale
              (note: different scale from the other score columns). May
              be blank.
          - name: score_trust
            description: >
              Average reader-survey trust score, on a 0-100 scale (note:
              different scale from the other score columns). May be
              blank or the string `"N/A"`.
          - name: score_engagement
            description: >
              Average reader-survey engagement score, 0-10 scale. This
              survey dimension was only introduced partway through 2024 -
              articles published before that date will always have this
              blank, not just occasionally missing.
          - name: num_responses_relevance
            description: >
              Number of survey responses backing `score_relevance`. May
              be `0` or blank, including cases where a score value is
              present but the response count wasn't recorded correctly.
          - name: num_responses_clarity
            description: Number of survey responses backing `score_clarity`.
          - name: num_responses_bias
            description: Number of survey responses backing `score_bias`.
          - name: num_responses_trust
            description: Number of survey responses backing `score_trust`.
          - name: num_responses_engagement
            description: >
              Number of survey responses backing `score_engagement`. Will
              be blank/zero for any article published before the
              engagement dimension was introduced.

      - name: authors
        description: One row per author.
        columns:
          - name: author_id
            description: Primary key for an author.
            tests:
              - unique
              - not_null
          - name: name
            description: Author's display name.
          - name: email
            description: Author's email address.
          - name: joined_at
            description: Date the author joined the platform.

      - name: page_views
        identifier: views
        description: >
          One row per page view event. `user_id` may be null for
          anonymous/unauthenticated views.
        columns:
          - name: view_id
            description: Primary key for a page view event.
          - name: article_id
            description: Foreign key to `raw_news__articles.article_id`.
          - name: user_id
            description: >
              Foreign key to the user who viewed the article. Null for
              anonymous views - do not assume this is always populated.
          - name: viewed_at
            description: Timestamp the page view occurred.
          - name: referrer_source
            description: >
              Raw referrer channel. Contains casing inconsistencies and
              synonyms (e.g. "organic" and "search" mean the same thing) -
              not yet normalized.