version: 2

sources:
  - name: podcasts
    database: mediapulse_raw
    schema: podcasts
    description: >
      Raw data from PodcastHub, MediaPulse's podcast network.

    tables:
      - name: shows
        description: >
          One row per podcast show on PodcastHub.
        columns:
          - name: show_id
            description: Primary key.
            data_tests:
              - not_null
              - unique
          - name: show_name
            description: Display name of the show.
            data_tests:
              - not_null
          - name: host_name
            description: Name of the primary show host.
          - name: category
            description: Show genre/category. Values include Politics, Technology, Sports, Entertainment.
          - name: launched_at
            description: Date the show launched on PodcastHub.

      - name: episodes
        description: >
          One row per episode published under a show.
          Note: the raw column for the episode name is 'title', not 'episode_name'.
        columns:
          - name: episode_id
            description: Primary key.
            data_tests:
              - not_null
              - unique
          - name: show_id
            description: Foreign key to shows.
            data_tests:
              - not_null
              - relationships:
                  arguments: 
                    to: source('podcasts', 'shows')
                    field: show_id
          - name: title
            description: Episode title.
          - name: published_at
            description: Timestamp when the episode was published.
          - name: duration_seconds
            description: Runtime of the episode in seconds.
          - name: season
            description: Season number (nullable for non-seasonal shows).
          - name: episode_number
            description: Episode number within the season or overall feed.

      - name: listens
        description: >
          Individual listen events - one row per user/episode listening session.
        columns:
          - name: listen_id
            description: Primary key.
            data_tests:
              - not_null
              - unique
          - name: episode_id
            description: Foreign key to episodes.
          - name: user_id
            description: The listener (nullable for anonymous sessions).
          - name: listened_at
            description: Timestamp when the listen session started.
          - name: listen_duration_seconds
            description: How long the user actually listened.
          - name: platform_id
            description: "Platform used. Expected: 1(ios), 2(web), 3(android), 4(other), 5(alexa)"
            data_tests:
              - accepted_values:
                  arguments:
                    values: ["ios", "android", "web", "alexa", "other"]