version: 2

models:
  - name: stg_podcasts__shows
    description: >
      Staged show records from PodcastHub. One row per show.
    columns:
      - name: show_id
        description: Primary key.
        data_tests:
          - not_null
          - unique
      - name: show_name
        description: Display name of the show.
        data_tests:
          - not_null
      - name: host_name
        description: Name of the primary host.
      - name: category
        description: Show genre/category.
      - name: launched_at
        description: Date the show launched on PodcastHub.

  - name: stg_podcasts__episodes
    description: >
      Staged episode records from PodcastHub. One row per episode.
    columns:
      - name: episode_id
        description: Primary key.
        data_tests:
          - not_null
          - unique
      - name: show_id
        description: Foreign key to stg_podcasts__shows.
        data_tests:
          - not_null
      - name: episode_title
        description: Title of the episode.
        data_tests:
          - not_null
      - name: published_at
        description: Timestamp when the episode was published.
        data_tests:
          - not_null
      - name: duration_seconds
        description: Episode runtime in seconds.
      - name: season
        description: Season number (nullable).
      - name: episode_number
        description: Episode number within the show.

  - name: stg_podcasts__listens
    description: >
      Staged listen session records from PodcastHub. One row per listen session,
      preserving source identifiers and event attributes without enrichment joins.
    columns:
      - name: listen_id
        description: Primary key.
        data_tests:
          - not_null
          - unique
      - name: episode_id
        description: Foreign key to stg_podcasts__episodes.
        data_tests:
          - not_null
      - name: user_id
        description: The listener. Null for anonymous sessions.
      - name: listened_at
        description: Timestamp when the listen session started.
        data_tests:
          - not_null
      - name: listen_duration_seconds
        description: How long the user actually listened, in seconds.
      - name: platform_id
        description: Numeric PodcastHub platform identifier used by platform_mapping.
        data_tests:
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5]
                quote: false
