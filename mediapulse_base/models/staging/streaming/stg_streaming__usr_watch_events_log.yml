version: 2

models:
  - name: stg_streaming__usr_watch_events_log
    description: User watch events from the streaming platform.

    columns:
      - name: event_id
        description: Unique identifier for the watch event.
        tests:
          - not_null
          - unique

      - name: user_id
        description: Identifier of the user.
        tests:
          - not_null

      - name: content_id
        description: Identifier of the watched content.
        tests:
          - not_null

      - name: watched_at
        description: Timestamp when the content was watched.
        tests:
          - not_null

      - name: watch_duration_seconds
        description: Duration of the watch event in seconds.
        tests:
          - not_null

      - name: device_type
        description: Device used to watch the content.
        tests:
          - not_null

      - name: batched_at
        description: Timestamp when the event was batched.
        tests:
          - not_null