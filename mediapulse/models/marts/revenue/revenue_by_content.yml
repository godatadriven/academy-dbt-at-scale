models:
  - name: revenue_by_content
    description: This model calculates the allocation of ad revenue to individual content items across the MediaPulse portfolio. It integrates data from ad spend, campaigns, and impressions to determine the revenue generated by each content item. The model also accounts for commission rates to compute the final revenue attributed to MediaPulse.
    tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 10
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
            - campaign_id
            - content_id
            - impression_date
    columns:
      - name: campaign_id
        description: The unique identifier for the advertising campaign.
      - name: content_id
        description: The unique identifier for the content item.
      - name: impression_date
        description: The date when the impressions were recorded.
      - name: impressions_count
        description: The total number of impressions for the content item on the given date.
        tests:
        - dbt_expectations.expect_column_values_to_be_between:
            arguments:
              min_value: 0
      - name: campaign_type
        description: The type of advertising campaign.
      - name: spend_dollars
        description: The total amount spent on the campaign in dollars.
      - name: net_spend_dollars
        description: The net amount spent on the campaign after platform fees, in dollars.
      - name: impression_share
        description: The proportion of total impressions attributed to the content item for the campaign on the given date.
        tests:
        - dbt_expectations.expect_column_values_to_be_between:
            arguments:
              min_value: 0
              max_value: 1
            config:
              severity: error
      - name: allocated_spend_dollars
        description: The portion of the total spend allocated to the content item based on impression share.
        tests:
        - dbt_expectations.expect_column_values_to_be_between:
            arguments:
              min_value: 0
            config:
              severity: warn
      - name: allocated_net_spend_dollars
        description: The portion of the net spend allocated to the content item based on impression share.
      - name: commission_rate
        description: The commission rate applied to the net spend for the campaign type.
      - name: mediapulse_revenue_dollars
        description: The revenue generated for MediaPulse from the content item after applying the commission rate.
        tests:
        - dbt_expectations.expect_column_values_to_be_between:
            arguments:
              min_value: 0