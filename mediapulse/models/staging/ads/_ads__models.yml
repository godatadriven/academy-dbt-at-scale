version: 2

models:
    - name: stg_ads__campaigns
      description: >
        Grain per campaign_id
      columns:
        - name: campaign_id
        - name: advertiser_id
        - name: campaign_name
        - name: campaign_typ
        - name: start_date
        - name: end_date
        - name: budget
    - name: stg_ads__impressions
      description: >
          Grain per impression_id
      columns:
        - name: impression_id
        - name: campaign_id
        - name: content_id
        - name: impression_date
        - name: impressions_count
        - name: clicks
    - name: stg_ads__spend
      description: >
        Grain per spend_id and campaign_id
      columns:
        - name: campaign_id
        - name: spend_date
        - name: spend
        - name: platform_fee