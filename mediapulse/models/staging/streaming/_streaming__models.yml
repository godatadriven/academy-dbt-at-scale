version: 2

models:
  - name: stg_streaming__content_catalog
    description: ""
    columns:
      - name: content_id
        data_tests:
          - unique
          - not_null
  - name: stg_streaming__subscriptions
    description: ""
    columns:
      - name: subscription_id
        data_tests:
          - unique
          - not_null
      - name: subscription_status
        data_tests:
          - accepted_values:
              arguments: 
                values:
                  - paused
                  - cancelled
                  - active
                  - trialing
      - name: plan_type
        data_tests:
          - accepted_values:
              arguments: 
                values:
                  - premium
                  - standard
                  - basic
  - name: stg_streaming__watch_events
    description: ""
    columns:
      - name: sf_hash_key
        data_tests:
          - unique
          - not_null
      - name: dbt_hash_key
        data_tests:
          - unique
          - not_null
      - name: device_type
        data_tests:
          - accepted_values:
              arguments: 
                values: 
                  - smart tv
                  - tablet
                  - web
                  - mobile