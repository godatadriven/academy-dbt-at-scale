version: 2

sources:
  - name: streaming # you choose this
    schema: streaming
    tables:
      - name: content_catalog # you choose this
        identifier: content_ctlg
        columns:
          - name: content_id
            data_tests:
              - not_null
              - unique              
      - name: watch_events # you choose this
        identifier: usr_watch_events_log
        columns:
          - name: concat(event_id, user_id, watched_at)
            data_tests:
              - not_null
              - unique
        config: 
          freshness:
            warn_after:
              count: 5
              period: day
            error_after:
              count: 2000
              period: day
          loaded_at_field: batched_at
      - name: subscriptions # you choose this
        identifier: subscriptions_lifecycle_rec
        columns:
          - name: subscription_id
            data_tests:
              - not_null
              - unique
              
models:
  - name: stg_streaming__watch_events
    description: "View on the raw streaming events source data"
    data_tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments: 
            min_value: 10
    columns:
      - name: event_id
        data_type: varchar
        description: "Id for the event"
        data_tests:
          - not_null
          - unique:
              arguments:
                config:
                  store_failures: true
                  where: "device_type != 'mobile'"

      - name: user_id
        data_type: varchar
        description: "User id"
        data_tests:
          - not_null

      - name: content_id
        data_type: varchar
        description: "Content id"
        data_tests:
          - not_null
          - relationships:
              arguments: 
                to: ref('stg_streaming__content_catalog')
                field: content_id

      - name: watched_at
        data_type: varchar
        description: "Timestap the content has been watched"
        data_tests:
          - not_null

      - name: watch_duration_seconds
        data_type: number
        description: "Watch duration in seconds"
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 86400

      - name: device_type
        data_type: varchar
        description: "Type of device content has been watched"
        data_tests:
          - accepted_values:
              arguments: 
                values: ['smart tv', 'tablet', 'mobile', 'web', 'console']
              config: 
                severity: warn
          - dbt_expectations.expect_column_distinct_values_to_contain_set:
              arguments: 
                value_set: ['smart tv', 'tablet', 'mobile', 'web']

      - name: batched_at
        data_type: timestamp_ntz
        description: "Timestamp at which the event has been created"
        data_tests:
          - not_null

      - name: hash_key
        data_type: varchar
        description: "MD5 hashkey based on event_id, user_id and content_id"
        data_tests:
          - unique
          - not_null

  - name: stg_streaming__content_catalog
    description: ""
    columns:
      - name: content_id
        data_type: varchar
        description: "Content ID"
        data_tests:
          - not_null
          - unique

      - name: title
        data_type: varchar
        description: "Title of content watched"

      - name: genre
        data_type: varchar
        description: "Genre of content"

      - name: content_type
        data_type: varchar
        description: "Type of content"
        data_tests:
          - accepted_values:
              arguments: 
                values: ['live', 'series', 'film']
              config: 
                severity: warn

      - name: release_date
        data_type: varchar
        description: "Release date of content"
        data_tests:
          - not_null

      - name: runtime_in_minutes
        data_type: number
        description: "Runtime in minutes of content"
 
  - name: stg_streaming__subscriptions
    description: ""
    data_tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments: 
            min_value: 5
    columns:
      - name: subscription_id
        data_type: varchar
        description: "ID of subscription"
        data_tests:
          - not_null
          - unique

      - name: user_id
        data_type: varchar
        description: "User ID"
        data_tests:
          - not_null

      - name: plan_type
        data_type: varchar
        description: "Type of plan"
        data_tests:
          - accepted_values:
              arguments:
                values: ['premium', 'standard', 'basic']

      - name: subscription_status
        data_type: varchar
        description: "Status of subscription"
        data_tests:
          - accepted_values:
              arguments: 
                values: ['paused', 'cancelled', 'active', 'trialing']
              config: 
                severity: warn

      - name: start_date
        data_type: varchar
        description: "Start date of subscription"
        data_tests:
          - not_null

      - name: start_time
        data_type: varchar
        description: "Start time of subscription"
        data_tests:
          - not_null

      - name: started_at
        data_type: timestamp_ntz
        description: "Start time stamp of subscription"
        data_tests:
          - not_null

      - name: end_date
        data_type: varchar
        description: "End date of subscription"

      - name: end_time
        data_type: varchar
        description: "End time of subscription"

      - name: ended_at
        data_type: timestamp_ntz
        description: "End time stamp of subscription"

      - name: monthly_fee_dollars
        data_type: number
        description: "Monthly fee in dollars"
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments: 
                min_value: 0
                row_condition: "subscription_status != 'trialing'"
                strictly: true
                

