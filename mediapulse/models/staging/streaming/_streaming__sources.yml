version: 2

sources:
  - name: streaming
    schema: streaming
    tables:
      - name: content_catalog
        identifier: content_ctlg
        columns:
          - name: content_id
            data_tests:
              - unique 
              - not_null
      - name: subscriptions
        identifier: subscriptions_lifecycle_rec
        columns:
          - name: subscription_id
            data_tests:
              - unique 
              - not_null
      - name: watch_events
        identifier: usr_watch_events_log
        data_tests:
          - dbt_utils.unique_combination_of_columns:
              description: Needed since watch event_ids can be reused
              arguments:
                combination_of_columns:
                  - event_id
                  - user_id
                  - watched_at
        columns:
          - name: event_id 
            description: Can be reused in future watch events - not unique
            data_tests:
              - not_null