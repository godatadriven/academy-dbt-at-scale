version: 2

sources:
  - name: news
    # database: "{{ var('raw_database') }}"
    # Uncomment the line above and set raw_database in dbt_project.yml vars
    # if your raw data lives in a separate database (e.g. Snowflake multi-db).
    # For the workshop seed setup, leave commented - seeds load into your target database.
    schema: news
    description: >
      Raw data from NewsNow, MediaPulse's digital news outlet.
      Loaded by the upstream ingestion pipeline.
    tables:
      - name: articles
        description: >
          All articles ever published on NewsNow, including subsequent versions.
          A single article_id may appear more than once when an article is updated
          or republished - each version gets its own row with a new updated_at timestamp.
        data_tests:
          - dbt_utils.unique_combination_of_columns:
              arguments:
                combination_of_columns:
                - article_id 
                - updated_at



        columns:
          - name: article_id
            description: Article identifier. See updated_at to identify the most recent version of each article.
          - name: title
            description: Article headline.
          - name: author_id
            description: Foreign key to the authors table.
          - name: category
            description: Editorial category assigned at publication time.
          - name: published_at
            description: Timestamp when the article first went live.
          - name: updated_at
            description: Timestamp of the most recent edit or republication.
          - name: status
            description: "Current article status. Expected values: draft, published, archived."
          - name: word_count
            description: Number of words in the article body.

      - name: authors
        description: NewsNow editorial staff and contributors.
        columns:
          - name: author_id
            description: Primary key.
          - name: name
            description: Author's full name.
          - name: email
            description: Author's work email address.
          - name: joined_at
            description: Date the author joined the NewsNow team.

      - name: page_views
        identifier: views
        description: >
          Individual page view events recorded when a user loads an article page.
          One row per view event.
        columns:
          - name: view_id
            description: Primary key.
          - name: article_id
            description: The article that was viewed.
          - name: user_id
            description: The user who viewed the article (nullable for anonymous sessions).
          - name: viewed_at
            description: Timestamp of the page view event.
          - name: referrer_source
            description: "Traffic source. Examples: search, social, direct, email."
