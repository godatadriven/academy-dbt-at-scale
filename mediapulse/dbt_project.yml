name: "mediapulse"
version: "1.0.0"
config-version: 2

profile: "mediapulse"

model-paths:    ["models"]
analysis-paths: ["analyses"]
test-paths:     ["tests"]
seed-paths:     ["seeds"]
macro-paths:    ["macros"]
snapshot-paths: ["snapshots"]
docs-paths:     ["docs"]

clean-targets:
  - "target"
  - "dbt_packages"

# ---------------------------------------------------------------------------
# Variable overrides - set raw_database to wherever your source data lives.
# In dbt Cloud you can set this as an environment-level variable.
# ---------------------------------------------------------------------------
vars:
  raw_database: "RAW"   # change to match your warehouse setup
  elementary:
    elementary_schema: dbt_lushep_elementary

# ---------------------------------------------------------------------------
# Model materialisation defaults
# ---------------------------------------------------------------------------
models:
  mediapulse:
    staging:
      +materialized: view
    marts:
      +materialized: table

snapshots:
  mediapulse:
    +target_schema: snapshots

seeds:
  mediapulse:
    +schema: seeds # choose where the seeds should land in the warehouse
    category_mapping:
      +column_types:
        category: varchar
        category_group: varchar