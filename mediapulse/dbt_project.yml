name: "mediapulse"
version: "1.0.0"
config-version: 2

profile: "mediapulse"

model-paths:    ["models"]
analysis-paths: ["analyses"]
test-paths:     ["tests"]
seed-paths:     ["seeds"]
macro-paths:    ["macros"]
snapshot-paths: ["snapshots"]
docs-paths:     ["docs"]

clean-targets:
  - "target"
  - "dbt_packages"

# ---------------------------------------------------------------------------
# Variable overrides - set raw_database to wherever your source data lives.
# In dbt Cloud you can set this as an environment-level variable.
# ---------------------------------------------------------------------------
vars:
  raw_database: "RAW"   # change to match your warehouse setup

# ---------------------------------------------------------------------------
# Model materialisation defaults
# ---------------------------------------------------------------------------
models:
  mediapulse:
    staging:
      +materialized: view
      +schema: staging
    marts:
      +materialized: table
      +schema: marts

snapshots:
  mediapulse:
    +target_schema: snapshots