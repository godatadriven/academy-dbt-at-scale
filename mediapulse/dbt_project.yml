name: "mediapulse"
version: "1.0.0"
config-version: 2

profile: "mediapulse"

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
docs-paths: ["docs"]

clean-targets:
  - "target"
  - "dbt_packages"

# ---------------------------------------------------------------------------
# Variable overrides - set raw_database to wherever your source data lives.
# In dbt Cloud you can set this as an environment-level variable.
# ---------------------------------------------------------------------------
vars:
  raw_database: "RAW"   # change to match your warehouse setup
  dbt_date:time_zone: "UTC"

# ---------------------------------------------------------------------------
# Model materialisation defaults
# ---------------------------------------------------------------------------
models:
  mediapulse:
    staging:
      +materialized: view
    marts:
      +materialized: table

snapshots:
  mediapulse:
    +target_schema: snapshots
flags:
  require_generic_test_arguments_property: true