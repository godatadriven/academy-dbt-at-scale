version: 2

models:
  - name: dim_dates
    description: >
      Shared calendar dimension spanning 2023-01-01 to 2026-12-31. Join any fact
      table's date column to date_day here to get year/quarter/month/day-of-week
      attributes without repeating date-part logic per mart.
    columns:
      - name: date_day
        description: Primary key. One row per calendar day.
        data_tests:
          - not_null
          - unique
      - name: year
        description: Calendar year.
      - name: quarter
        description: Calendar quarter (1-4).
      - name: month
        description: Calendar month number (1-12).
      - name: day_of_month
        description: Day of the month (1-31).
      - name: day_of_week
        description: Day of week, 0 = Sunday.
      - name: month_start_date
        description: First day of the month this date falls in.
      - name: is_weekend
        description: True for Saturday and Sunday.

  - name: dim_campaigns
    description: >
      One row per AdConnect campaign. The conformed campaign dimension - both
      fct_ad_impressions (mediapulse_platform) and the revenue marts in
      mediapulse_analytics join to this for campaign attributes.
    columns:
      - name: campaign_id
        description: Primary key.
        data_tests:
          - not_null
          - unique
      - name: campaign_name
        description: Human-readable campaign name.
      - name: campaign_type
        description: "Campaign type. Expected values: display, video, sponsored_content, podcast_ad, newsletter."
      - name: advertiser_id
        description: The advertiser who owns this campaign.
      - name: start_date
        description: Campaign start date.
      - name: end_date
        description: Campaign end date.
      - name: budget_dollars
        description: Total campaign budget, converted from budget_cents.
