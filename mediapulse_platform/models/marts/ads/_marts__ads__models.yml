models:
  - name: dim_campaigns
    description: >
      One row per AdConnect campaign. The conformed campaign dimension - both
      fct_ad_impressions (mediapulse_platform) and the revenue marts in
      mediapulse_analytics join to this for campaign attributes.
    columns:
      - name: campaign_id
        description: Primary key.
        data_tests:
          - not_null
          - unique
      - name: campaign_name
        description: Human-readable campaign name.
      - name: campaign_type
        description: "Campaign type. Expected values: display, video, sponsored_content, podcast_ad, newsletter."
      - name: advertiser_id
        description: The advertiser who owns this campaign.
      - name: start_date
        description: Campaign start date.
      - name: end_date
        description: Campaign end date.
      - name: budget_dollars
        description: Total campaign budget, converted from budget_cents.

  - name: fct_ad_impressions
    description: >
      One row per campaign/content impression record, enriched with the
      campaign's type and a computed click-through rate.
    columns:
      - name: impression_id
        description: Primary key.
        data_tests:
          - not_null
          - unique
      - name: campaign_id
        description: Foreign key to dim_campaigns.
        data_tests:
          - not_null
      - name: campaign_type
        description: "Campaign type, from dim_campaigns. Expected values: display, video, sponsored_content, podcast_ad, newsletter."
      - name: content_id
        data_tests:
          - not_null
      - name: impression_date
        data_tests:
          - not_null
      - name: impressions_count
        data_tests:
          - not_null
      - name: clicks
      - name: click_through_rate
        description: clicks divided by impressions_count, rounded to 4 decimal places. Zero when impressions_count is zero.