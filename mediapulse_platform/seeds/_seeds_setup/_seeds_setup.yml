version: 2

seeds:
  # Raw source seeds simulate the upstream data pipelines.
  # They land in the same schemas the source definitions point at,
  # so the project works without an external ingestion layer.
  - name: raw_news__authors
    config:
      database: mediapulse_raw
      schema: news
      alias: authors
      column_types:
        joined_at: varchar

  - name: raw_news__articles
    config:
      database: mediapulse_raw
      schema: news
      alias: articles
      column_types:
        published_at: varchar
        updated_at: varchar

  - name: raw_news__articles_updated
    config:
      database: mediapulse_raw
      schema: news
      alias: articles_updated
      column_types:
        published_at: varchar
        updated_at: varchar

  - name: raw_news__page_views
    config:
      database: mediapulse_raw
      schema: news
      alias: views
      column_types:
        viewed_at: varchar

  - name: raw_podcasts__shows
    config:
      database: mediapulse_raw
      schema: podcasts
      alias: shows
      column_types:
        launched_at: varchar

  - name: raw_podcasts__episodes
    config:
      database: mediapulse_raw
      schema: podcasts
      alias: episodes
      column_types:
        published_at: varchar

  - name: raw_podcasts__episodes_updated
    config:
      database: mediapulse_raw
      schema: podcasts
      alias: episodes_updated
      column_types:
        published_at: varchar

  - name: raw_podcasts__listens
    config:
      database: mediapulse_raw
      schema: podcasts
      alias: listens
      column_types:
        listened_at: varchar

  - name: raw_streaming__content_catalog
    config:
      database: mediapulse_raw
      schema: streaming
      alias: content_ctlg
      column_types:
        release_date: varchar

  - name: raw_streaming__subscriptions
    config:
      database: mediapulse_raw
      schema: streaming
      alias: subscriptions_lifecycle_rec
      column_types:
        start_date: varchar
        start_time: varchar
        end_date: varchar
        end_time: varchar

  - name: raw_streaming__watch_events
    config:
      database: mediapulse_raw
      schema: streaming
      alias: usr_watch_events_log
      column_types:
        watched_at: varchar
        batched_at: timestamp

  - name: raw_ads__campaigns
    config:
      database: mediapulse_raw
      schema: ads
      alias: campaigns
      column_types:
        start_date: varchar
        end_date: varchar

  - name: raw_ads__impressions
    config:
      database: mediapulse_raw
      schema: ads
      alias: impressions
      column_types:
        impression_date: varchar

  - name: raw_ads__spend
    config:
      database: mediapulse_raw
      schema: ads
      alias: spend
      column_types:
        spend_date: varchar

## Legacy data 

  - name: raw_legacy_streaming__content_catalog
    config:
      database: mediapulse_raw
      schema: streamview_legacy
      alias: media_catalog_archive
      column_types:
        release_dt: varchar

  - name: raw_legacy_streaming__subscriptions
    config:
      database: mediapulse_raw
      schema: streamview_legacy
      alias: acct_subs_archive
      column_types:
        start_dt: varchar
        start_tm: varchar
        end_dt: varchar
        end_tm: varchar

  - name: raw_legacy_streaming__watch_pings
    config:
      database: mediapulse_raw
      schema: streamview_legacy
      alias: playback_heartbeats
      column_types:
        ping_date: varchar
        ping_time: varchar