name: "mediapulse_platform"
version: "1.0.0"
config-version: 2

profile: "mediapulse_platform"

model-paths:    ["models"]
analysis-paths: ["analyses"]
test-paths:     ["tests"]
seed-paths:     ["seeds"]
macro-paths:    ["macros"]
snapshot-paths: ["snapshots"]
docs-paths:     ["docs"]

clean-targets:
  - "target"
  - "dbt_packages"

# ---------------------------------------------------------------------------
# Model materialisation and access defaults
# ---------------------------------------------------------------------------
models:
  mediapulse_platform:
    staging:
      +materialized: view
      +access: public
    intermediate:
      +materialized: view
      +access: protected
    marts:
      +materialized: table
      +access: protected
      streaming:
        +access: public
