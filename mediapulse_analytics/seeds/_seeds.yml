version: 2

seeds:
  - name: map_streaming_legacy_fields
    description: >
      Cross-reference between StreamView (legacy) identifiers and current
      MediaPulse identifiers, for the fields that have been migrated so far.
      Not every legacy id has an entry yet.
    columns:
      - name: mapping_type
        description: "Which id this row maps. One of: user_id, content_id."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["user_id", "content_id"]
      - name: legacy_id
        description: The StreamView identifier (subscriber_ref or media_id).
        data_tests:
          - not_null
      - name: mediapulse_id
        description: The corresponding current MediaPulse identifier.
        data_tests:
          - not_null
      - name: mapped_at
        description: Date the mapping was recorded.
