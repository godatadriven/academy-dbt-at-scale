version: 2

models:
  - name: fct_ad_revenue
    description: >
      MediaPulse revenue by content fact, mapping AdConnect ad revenue to the
      MediaPulse portfolio. Work in progress - see the model's header comment
      about the aggregation grain.
    columns:
      - name: campaign_id
        description: Primary key at this model's current grain.
        data_tests:
          - not_null
          - unique
      - name: campaign_name
        description: Human-readable campaign name.
      - name: campaign_type
        description: "Campaign type. Expected values: display, video, sponsored_content, podcast_ad, newsletter."
        data_tests:
          - accepted_values:
              arguments:
                values: ["display", "video", "sponsored_content", "podcast_ad", "newsletter"]
      - name: advertiser_id
        description: The advertiser who owns this campaign.
        data_tests:
          - not_null
      - name: total_spend_dollars
        description: Total spend across all spend records for this campaign, converted to dollars.
      - name: total_net_spend_dollars
      - name: first_spend_date
        description: Earliest spend_date recorded for this campaign.
      - name: last_spend_date
