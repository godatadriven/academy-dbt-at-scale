version: 2

models:
  - name: dim_sales_reps
    description: >
      One row per AdConnect sales rep, with advertiser coverage stats.
    columns:
      - name: rep_id
        description: Primary key.
        data_tests:
          - not_null
          - unique
      - name: rep_name
        description: Rep's full name.
      - name: region
      - name: hire_date
        description: Date the rep joined the sales team.
      - name: total_advertisers
        description: Count of advertiser accounts currently assigned to this rep.
        data_tests:
          - not_null

  - name: dim_advertisers
    description: >
      One row per advertiser account, enriched with the owning sales rep.
      advertiser_id matches the advertiser_id used in the ads domain.
    columns:
      - name: advertiser_id
        description: Primary key.
        data_tests:
          - not_null
          - unique
      - name: advertiser_name
        description: Advertiser's company name.
      - name: industry
      - name: contract_tier
        description: "Account tier. Expected: bronze, silver, gold, platinum."
        data_tests:
          - accepted_values:
              arguments:
                values: ["bronze", "silver", "gold", "platinum"]
      - name: account_status
        description: "Account status. Expected: active, at_risk, churned."
        data_tests:
          - accepted_values:
              arguments:
                values: ["active", "at_risk", "churned"]
      - name: signed_at
      - name: rep_id
        description: Foreign key to dim_sales_reps.
      - name: rep_name
        description: Name of the assigned sales rep, from dim_sales_reps.

  - name: fct_advertiser_contracts
    description: >
      One row per advertiser contract term.
    columns:
      - name: contract_id
        description: Primary key.
        data_tests:
          - not_null
          - unique
      - name: advertiser_id
        description: Foreign key to dim_advertisers.
        data_tests:
          - not_null
      - name: contract_value_dollars
        description: Total contract value, converted from contract_value_cents.
      - name: start_date
      - name: end_date
      - name: contract_length_days
        description: Number of days between start_date and end_date.
      - name: renewal_status
        description: "Contract status. Expected: active, renewed, churned."
        data_tests:
          - accepted_values:
              arguments:
                values: ["active", "renewed", "churned"]

  - name: fct_crm_touchpoints
    description: >
      One row per sales touchpoint (call, email, meeting, demo) with an
      advertiser, enriched with the rep's name.
    columns:
      - name: touchpoint_id
        description: Primary key.
        data_tests:
          - not_null
          - unique
      - name: advertiser_id
        description: Foreign key to dim_advertisers.
        data_tests:
          - not_null
      - name: rep_id
        description: Foreign key to dim_sales_reps.
      - name: rep_name
        description: Name of the rep who logged this touchpoint.
      - name: touchpoint_type
        description: "Activity type. Expected: call, email, meeting, demo."
        data_tests:
          - accepted_values:
              arguments:
                values: ["call", "email", "meeting", "demo"]
      - name: occurred_at
        description: Timestamp the activity occurred.
      - name: notes
