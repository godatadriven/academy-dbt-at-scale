version: 2

models:
  - name: stg_streamview_legacy__content
    description: >
      Staged content records from the StreamView legacy archive. One row per
      legacy content item.
    columns:
      - name: legacy_content_id
        description: Primary key.
        data_tests:
          - not_null
          - unique
      - name: content_title
        description: Content title as recorded in StreamView.
        data_tests:
          - not_null
      - name: category
      - name: content_format
        description: "Legacy content format. Expected: tv_series, movie, live_event."
        data_tests:
          - accepted_values:
              arguments:
                values: ["tv_series", "movie", "live_event"]
      - name: release_date
      - name: duration_minutes

  - name: stg_streamview_legacy__subscriptions
    description: >
      Staged subscription lifecycle records from the StreamView legacy archive.
      One row per legacy subscriber account.
    columns:
      - name: legacy_subscriber_id
        description: Primary key.
        data_tests:
          - not_null
          - unique
      - name: tier
        data_tests:
          - accepted_values:
              arguments:
                values: ["bronze", "silver", "gold"]
      - name: account_status
        data_tests:
          - accepted_values:
              arguments:
                values: ["active", "terminated"]
      - name: start_dt
        data_tests:
          - not_null
      - name: start_tm
      - name: end_dt
      - name: end_tm

  - name: stg_streamview_legacy__watch_pings
    description: >
      Staged playback heartbeat pings from the StreamView legacy archive. One
      row per ping, recorded roughly once per minute of playback.
    columns:
      - name: ping_id
        description: Primary key.
        data_tests:
          - not_null
          - unique
      - name: legacy_subscriber_id
        description: Foreign key to stg_streamview_legacy__subscriptions.
        data_tests:
          - not_null
      - name: legacy_content_id
        description: Foreign key to stg_streamview_legacy__content.
        data_tests:
          - not_null
      - name: ping_date
        data_tests:
          - not_null
      - name: ping_time
      - name: playback_position_seconds
        data_tests:
          - not_null
      - name: device_code
