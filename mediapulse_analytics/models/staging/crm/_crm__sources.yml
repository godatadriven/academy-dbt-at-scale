version: 2

sources:
  - name: crm
    # database: omitted for BigQuery - `database` maps to the GCP project ID
    # and "mediapulse_raw" is not a valid project ID. Resolves to the target
    # project + the `crm` dataset, where set_up_project's seeds land.
    schema: crm
    description: >
      Raw data from the advertiser sales/account-management CRM.

    tables:
      - name: sales_reps
        description: One row per AdConnect sales rep.
        columns:
          - name: rep_id
            description: Primary key.
          - name: rep_name
            description: Rep's full name.
          - name: region
            description: Sales region the rep covers.
          - name: hire_date
            description: Date the rep joined the sales team.

      - name: advertiser_accounts
        description: One row per advertiser account.
        columns:
          - name: advertiser_id
            description: Advertiser identifier. Matches advertiser_id in ads.campaigns.
          - name: advertiser_name
            description: Advertiser's company name.
          - name: industry
            description: Advertiser's industry.
          - name: sales_rep_id
            description: Foreign key to sales_reps.
          - name: contract_tier
            description: "Account tier. Expected: bronze, silver, gold, platinum."
          - name: account_status
            description: "Account status. Expected: active, at_risk, churned."
          - name: signed_at
            description: Date the advertiser first signed with AdConnect.

      - name: contracts
        description: One row per advertiser contract term.
        columns:
          - name: contract_id
            description: Primary key.
          - name: advertiser_id
            description: Foreign key to advertiser_accounts.
          - name: contract_value_cents
            description: Total contract value in cents.
          - name: start_date
            description: Contract start date.
          - name: end_date
            description: Contract end date.
          - name: renewal_status
            description: "Contract status. Expected: active, renewed, churned."

      - name: touchpoints
        description: One row per sales activity (call, email, meeting, demo) with an advertiser.
        columns:
          - name: touchpoint_id
            description: Primary key.
          - name: advertiser_id
            description: Foreign key to advertiser_accounts.
          - name: rep_id
            description: Foreign key to sales_reps.
          - name: touchpoint_type
            description: "Activity type. Expected: call, email, meeting, demo."
          - name: occurred_at
            description: Timestamp the activity occurred.
          - name: notes
            description: Free-text notes logged by the rep.
